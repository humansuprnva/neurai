set timeout=5
set default=0
menuentry "NeurAI Integrated OS (AI interface)" {
    linux /boot/vmlinuz console=tty0 quiet loglevel=3
    initrd /boot/initrd.gz
}
menuentry "NeurAI Integrated OS - verbose boot" {
    linux /boot/vmlinuz console=tty0 loglevel=7
    initrd /boot/initrd.gz
}
menuentry "NeurAI Integrated OS - rescue shell (no AI)" {
    linux /boot/vmlinuz console=tty0 neurai.rescue
    initrd /boot/initrd.gz
}
