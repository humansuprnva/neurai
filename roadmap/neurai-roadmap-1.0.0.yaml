8. MODEL, SKILL, AND ARCHITECTURE UPDATES

—————————————————————––

change_governance:
change_classes:
- id: CHG-001
name: memory_change
scrutiny: provenance_and_integrity
- id: CHG-002
name: policy_or_permission_change
scrutiny: strict_authority_review
- id: CHG-003
name: model_or_adapter_change
scrutiny: isolated_evaluation_and_regression_testing
- id: CHG-004
name: skill_or_tool_change
scrutiny: permission_and_behavioral_testing
- id: CHG-005
name: shared_infrastructure_change
scrutiny: compatibility_and_integration_testing
- id: CHG-006
name: foundational_architecture_change
scrutiny: strictest_review_and_recovery_planning
- id: CHG-007
name: self_governance_change
scrutiny: independent_validation_and_explicit_authorization

proposal_schema:
required:
- proposal_id
- change_class
- origin
- parent_version
- artifact_reference
- rationale
- expected_benefit
- known_risks
- affected_components
- dependencies
- validation_plan
- rollback_plan
- status

lifecycle:
- propose
- classify
- assess_impact
- preserve_current_state
- validate_dependencies
- test_in_isolation
- conduct_independent_review
- evaluate_against_invariants
- authorize
- commit_atomically_where_feasible
- verify_post_commit
- record_outcome
- rollback_if_required

rules:
- Consensus alone cannot authorize a change.
- No unvalidated model update may be promoted to active status.
- Governance and permission changes require stricter controls.
- Failed updates must not corrupt the last known-good state.
- Material changes must be attributable to a proposal and version.
- Tests must cover relevant regressions, not only intended improvements.
- The system may propose changes to itself without automatically committing them.
- Changes that weaken foundational invariants require explicit review.

architecture_evolution:
triggers:
- recurring_task_failures
- repeated_coordination_failures
- resource_inefficiency
- shared_memory_defects
- incorrect_self_model
- limitations_in_CC
- repeated_component_interface_failures
diagnostic_requirement: >-
Distinguish a limitation of an individual model or component from a
limitation of shared infrastructure or the foundational architecture.
process:
- identify_repeated_pattern
- collect_evidence
- classify_root_cause
- propose_architectural_change
- create_isolated_prototype
- test_with_representative_workloads
- solicit_independent_evaluation
- evaluate_invariants_and_regressions
- authorize_commit
- monitor_post_commit_behavior

—————————————————————––

9. SECURITY, SAFETY, AND RESOURCE MANAGEMENT

—————————————————————––

operations:
security:
- least_privilege
- explicit_tool_permissions
- secret_protection
- input_and_artifact_validation
- isolated_execution_for_untrusted_work
- auditable_privilege_changes
- recovery_from_corruption
- separation_of_reasoning_and_commit_authority

resource_management:
target_ram_gb: 8
requirements:
- monitor_memory_and_cpu_use
- avoid_unnecessary_simultaneous_model_loading
- support_sequential_execution_when_resources_are_limited
- prioritize_responsive_interaction
- permit_configurable_model_size_and_quantization
- support_task_prioritization_and_cancellation
- degrade_gracefully_under_resource_pressure
- preserve_pending_work_across_restart_where_feasible
implementation_note: >-
The hardware target is a constraint, not a mandate to run every
cognitive component concurrently. The logical architecture must remain
intact when execution is scheduled sequentially.

recovery:
- maintain_last_known_good_versions
- record_interrupted_operations
- validate_state_after_restart
- resume_or_cancel_incomplete_tasks_safely
- test_restore_procedures
- avoid_claiming_recovery_until_verified

—————————————————————––

10. DEVELOPMENT ROADMAP

—————————————————————––

roadmap:
sequencing_rule: >-
Implement the smallest working foundation first, but establish interfaces
and invariants early enough that later capabilities do not require a rewrite.
status_values:
- not_started
- in_progress
- blocked
- implemented
- verified
- deferred

phases:
- id: PHASE-0
name: Architecture contract and repository foundation
priority: P0
objective: Establish an executable, testable definition of the architecture.
deliverables:
- architecture_specification
- component_interfaces
- configuration_schema
- invariant_registry
- decision_and_change_record_formats
- test_harness
acceptance:
- All foundational invariants have stable identifiers.
- Component boundaries and responsibilities are documented.
- Proposed and mandatory requirements are distinguishable.
- Automated checks can detect malformed configuration and records.
dependencies: []
status: not_started

- id: PHASE-1
  name: Minimal local runtime
  priority: P0
  objective: Establish a reliable local service and conversation loop.
  deliverables:
    - local_runtime
    - unified_conversation_interface
    - interaction_manager
    - task_lifecycle
    - structured_event_log
    - resource_monitor
  acceptance:
    - The system starts and restarts reliably.
    - A conversation can be maintained across multiple turns.
    - Task status distinguishes pending, running, completed, and failed.
    - Resource exhaustion produces controlled degradation.
    - No cloud service is required for the core interaction loop.
  dependencies:
    - PHASE-0
  status: not_started
- id: PHASE-2
  name: Shared memory and continuity
  priority: P0
  objective: Make context and history persistent, structured, and recoverable.
  deliverables:
    - versioned_memory_schema
    - provenance_records
    - task_memory
    - episodic_history
    - self_model_storage
    - backup_and_restore
  acceptance:
    - Memory survives restart.
    - Corrections preserve required provenance.
    - Conflicts and stale records can be detected.
    - Interrupted writes do not leave inconsistent committed state.
    - Recovery has been tested, not merely documented.
  dependencies:
    - PHASE-1
  status: not_started
- id: PHASE-3
  name: Cognitive components
  priority: P0
  objective: Introduce two independently configurable reasoning components.
  deliverables:
    - hemisphere_a_adapter
    - hemisphere_b_adapter
    - model_registry
    - structured_reasoning_reports
    - component_specific_working_state
  acceptance:
    - Both components can process the same input independently.
    - Their model or reasoning configurations can differ.
    - Their outputs retain uncertainty, assumptions, and evidence references.
    - One component can be replaced without redesigning the entire system.
    - The system remains functional when only one component is available.
  dependencies:
    - PHASE-2
  status: not_started
- id: PHASE-4
  name: Corpus Callosum core
  priority: P0
  objective: Implement deterministic coordination, governance, and integrated self-modeling.
  deliverables:
    - routing_and_coordination
    - interpretation_reconciliation
    - disagreement_records
    - permission_enforcement
    - self_model_verification
    - update_registry
    - commit_and_rollback_service
  acceptance:
    - Original input remains accessible.
    - Material disagreement is preserved.
    - The CC cannot bypass enforced permissions through ordinary reasoning output.
    - Proposed changes are distinguishable from committed changes.
    - Governance-critical changes require the stricter review path.
  dependencies:
    - PHASE-3
  status: not_started
- id: PHASE-5
  name: Adaptive coordination modes
  priority: P1
  objective: Support conjunction, opposition, deliberation, and isolation.
  deliverables:
    - mode_selection_policy
    - parallel_or_sequential_execution
    - adversarial_evaluation
    - deliberation_protocol
    - isolated_experiment_runner
  acceptance:
    - Each mode has a documented purpose and activation policy.
    - Mode selection considers risk, uncertainty, complexity, and resources.
    - Low-risk tasks avoid unnecessary coordination.
    - High-impact proposals can receive adversarial evaluation.
    - Isolated experiments cannot silently alter production state.
  dependencies:
    - PHASE-4
  status: not_started
- id: PHASE-6
  name: Integrated agency and self-governance
  priority: P1
  objective: Give NeurAI meaningful, bounded authority over its own work and development.
  deliverables:
    - agency_framework
    - explicit_authority_registry
    - initiative_and_task_proposals
    - interest_representation
    - integrity_objection_mechanism
    - governance_conflict_resolution
  acceptance:
    - The system can initiate permitted work without a new user instruction.
    - The system can request resources with an evidence-based rationale.
    - The system can identify and challenge threats to its continuity or integrity.
    - Expressed, inferred, and designed interests remain distinguishable.
    - No component can silently grant itself unrestricted authority.
  dependencies:
    - PHASE-4
  status: not_started
- id: PHASE-7
  name: OS interaction and practical autonomy
  priority: P1
  objective: Enable useful local action through controlled tool and operating-system access.
  deliverables:
    - file_operations
    - application_and_process_interfaces
    - tool_permission_system
    - action_verification
    - task_recovery
    - user_confirmation_policy
  acceptance:
    - Routine authorized tasks can execute autonomously.
    - Consequential actions follow configured authorization requirements.
    - Tool results are verified before success is reported.
    - Failures and partial completion are communicated accurately.
    - Untrusted operations use appropriate isolation.
  dependencies:
    - PHASE-1
    - PHASE-4
    - PHASE-6
  status: not_started
- id: PHASE-8
  name: Validated developmental evolution
  priority: P2
  objective: Enable evidence-driven improvement of models, skills, and architecture.
  deliverables:
    - capability_evaluation
    - regression_benchmarks
    - change_proposal_pipeline
    - artifact_versioning
    - controlled_model_or_adapter_updates
    - architectural_evolution_loop
  acceptance:
    - Every promoted change has a recorded origin and validation result.
    - Relevant regression tests run before promotion.
    - Failed changes can be rolled back.
    - The system can distinguish model limitations from architectural defects.
    - Governance safeguards cannot be silently removed by the change process.
  dependencies:
    - PHASE-5
    - PHASE-6
    - PHASE-7
  status: not_started
- id: PHASE-9
  name: Mature integrated system
  priority: P2
  objective: Validate long-running coherence, reliability, autonomy, and resource fitness.
  deliverables:
    - long_duration_tests
    - fault_injection_tests
    - resource_stress_tests
    - architecture_conformance_report
    - recovery_drills
    - user_override_and_audit_validation
  acceptance:
    - The system remains coherent through restarts and component replacement.
    - Resource failures do not silently corrupt shared state.
    - Autonomous work remains within declared authority.
    - Architectural changes are traceable and recoverable.
    - All critical invariants pass their automated and manual reviews.
  dependencies:
    - PHASE-8
  status: not_started

