11. ARCHITECTURAL CONFORMANCE RUBRIC

—————————————————————––

evaluation:
rubric_version: “1.0.0”

scoring:
scale:
0: absent_or_contradicted
1: documented_but_not_implemented
2: partially_implemented_or_manually_enforced
3: implemented_and_tested
4: independently_verified_under_representative_conditions
evidence_required: true
unsupported_self_attestation_is_sufficient: false

dimensions:
- id: RUB-001
name: Entity unity
checks:
- One persistent system identity is maintained.
- Component differences do not require separate identities.
- Shared continuity survives component replacement where feasible.
- id: RUB-002
name: Cognitive independence
checks:
- Both hemispheres can reason independently.
- Disagreement is preserved when material.
- Independent configurations and histories are supported.
- id: RUB-003
name: CC governance
checks:
- Deterministic permission enforcement is effective.
- The CC’s own limitations can be evaluated.
- Governance changes receive stricter review.
- id: RUB-004
name: Integrated agency
checks:
- NeurAI can initiate permitted work.
- The system has meaningful method-selection autonomy.
- Expressed interests can influence review and planning.
- id: RUB-005
name: Continuity and integrity
checks:
- Memory and artifacts are versioned.
- Changes have provenance.
- Recovery and rollback are tested.
- id: RUB-006
name: Epistemic reliability
checks:
- Claims distinguish evidence from inference.
- Uncertainty is represented accurately.
- Consensus is not substituted for validation.
- id: RUB-007
name: Interaction coherence
checks:
- One unified interface is maintained.
- Action status is reported accurately.
- Internal complexity is hidden unless relevant or requested.
- id: RUB-008
name: Security and authority
checks:
- Permissions are explicit.
- Sensitive operations follow review policy.
- Components cannot silently expand their authority.
- id: RUB-009
name: Resource fitness
checks:
- Operation is tested on the target hardware.
- Resource pressure degrades gracefully.
- Sequential execution is supported when needed.
- id: RUB-010
name: Developmental quality
checks:
- Proposed improvements have measurable acceptance criteria.
- Regression testing precedes promotion.
- Failed experiments inform future work without corrupting production state.

release_gates:
critical_invariants:
required_score: 3
dimensions:
- RUB-001
- RUB-003
- RUB-005
- RUB-006
- RUB-008
general_release:
required_score: 3
all_applicable_dimensions: true
score_4_policy: >-
Award only when evidence demonstrates independent verification under
representative conditions, not solely successful unit tests.
exceptions:
- Must identify the affected requirement.
- Must state the reason and risk.
- Must identify compensating controls.
- Must specify an owner and review condition.
- Must not silently waive a foundational invariant.

