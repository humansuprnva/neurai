14. PROJECT OPERATING RULES

—————————————————————––

project_rules:

* Treat this roadmap as a versioned architectural contract.
* Separate mandatory invariants from provisional implementation decisions.
* Do not mark a requirement verified without recorded evidence.
* Do not equate documentation with implementation.
* Do not equate successful execution with correct execution.
* Do not equate agreement with truth.
* Prefer the simplest implementation that preserves the intended architecture.
* Revisit implementation choices when measured evidence warrants it.
* Record deviations rather than silently changing the design.
* Update the roadmap when an accepted architectural decision changes scope.
* Preserve prior roadmap versions and document material changes.
* Evaluate architectural changes against the rubric before acceptance.

