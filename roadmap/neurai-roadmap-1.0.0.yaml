13. NON-GOALS AND OPEN QUESTIONS

—————————————————————––

non_goals:

* Require human-like personalities for the hemispheres.
* Require every internal decision to reach consensus.
* Treat the CC as infallible or omniscient.
* Treat unrestricted autonomy as the definition of agency.
* Assume that self-modeling proves subjective consciousness.
* Require all models to be loaded simultaneously.
* Require cloud services for foundational functionality.
* Permit unvalidated self-modification merely because it is self-initiated.
* Freeze the initial model choices or implementation language permanently.

open_questions:

* id: OPEN-001
    question: Which local models best fit each cognitive component on the target hardware?
    resolution: Benchmark representative models for quality, latency, and memory use.
* id: OPEN-002
    question: Which capabilities should each hemisphere specialize in initially?
    resolution: Evaluate task performance before fixing specialization.
* id: OPEN-003
    question: Which reasoning engine, if any, should augment the deterministic CC?
    resolution: Compare advisory reasoning implementations against defined benchmarks.
* id: OPEN-004
    question: What authority levels should apply to different OS operations?
    resolution: Define a permission matrix before enabling consequential actions.
* id: OPEN-005
    question: What mechanisms best preserve continuity across model replacement?
    resolution: Test memory, configuration, artifact, and provenance migration.
* id: OPEN-006
    question: How should the system represent evolving interests without prematurely fixing identity?
    resolution: Prototype evidence-backed, revisable interest records and evaluate their behavior.
* id: OPEN-007
    question: Which foundational changes require explicit human authorization?
    resolution: Establish a change-class policy with strict controls for governance and destructive operations.

