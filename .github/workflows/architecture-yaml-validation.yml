name: Architecture YAML validation

on:
  push:
    branches:
      - architecture/phase4-action-routing-interpretation-schema
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML
      - name: Parse governing architecture documents
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          yaml_paths = [
              Path("roadmap/decisions/ADR-003-bounded-cc-objection-disposition.yaml"),
              Path("roadmap/specifications/PHASE4-SPEC-001-addendum-1.2.0.yaml"),
          ]
          documents = {}
          for path in yaml_paths:
              with path.open("r", encoding="utf-8") as stream:
                  documents[path.name] = yaml.safe_load(stream)
              assert isinstance(documents[path.name], dict), f"{path}: top-level YAML value must be a mapping"

          adr = documents["ADR-003-bounded-cc-objection-disposition.yaml"]
          assert adr["decision_id"] == "ADR-003"
          assert adr["status"] == "accepted"

          addendum = documents["PHASE4-SPEC-001-addendum-1.2.0.yaml"]["addendum"]
          assert addendum["version"] == "1.2.0"
          ids = addendum["conformance_test_registry"]["test_ids"]
          assert len(ids) == len(set(ids)), "Duplicate conformance test IDs in registry"
          test_groups = [
              addendum["action_routing_tests"],
              addendum["interpretation_tests"],
              addendum["deliberation_tests"],
              addendum["resolution_ADR002_OQ_D"]["conformance_tests"],
          ]
          actual_ids = [test["id"] for group in test_groups for test in group]
          assert len(actual_ids) == len(set(actual_ids)), "Duplicate conformance test IDs in test cases"
          assert set(actual_ids) == set(ids), "Registry and defined conformance tests differ"

          roadmap_text = Path("roadmap/neurai-roadmap-1.3.0.yaml").read_text(encoding="utf-8")
          assert "Document version: 1.3.0" in roadmap_text
          assert "ADR-003 (2026-11-15)" in roadmap_text
          assert "Prior version preserved as neurai-roadmap-1.2.0.yaml" in roadmap_text
          print(f"Parsed {len(yaml_paths)} YAML documents; roadmap version and ADR-003 text checks passed.")
          PY
      - name: Publish commit validation status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.JOB_STATUS === "success" ? "success" : "failure";
            const description = state === "success"
              ? "Architecture YAML parsed; metadata and test registry checks passed."
              : "Architecture YAML validation failed; inspect the workflow log.";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: "architecture-yaml-validation",
              description
            });
